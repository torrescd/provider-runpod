name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  GO_VERSION: 1.25.11

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Verify formatting
        shell: bash
        run: test -z "$(gofmt -l ./apis ./cmd ./internal)"
      - name: Unit and fake-controller tests
        run: go test -race -coverprofile=coverage.out ./...
      - name: Vet
        run: go vet ./...
      - name: Build binaries
        env:
          CGO_ENABLED: "0"
        run: |
          go build -trimpath -ldflags='-s -w' ./cmd/provider
          go build -trimpath -ldflags='-s -w' ./cmd/model-router

  generated:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Regenerate APIs and CRDs
        run: |
          go mod tidy
          go generate ./apis
      - name: Upload generated tree for review
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: generated-${{ github.sha }}
          path: |
            apis/**/zz_generated.*.go
            package/crds/*.yaml
            go.mod
            go.sum
      - name: Generated files are committed
        run: git diff --exit-code

  codeql:
    runs-on: ubuntu-24.04
    permissions:
      security-events: write
      packages: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Initialize CodeQL
        uses: github/codeql-action/init@6f5948dfacef28e207b48d0905cf90c03365536d # v3
        with:
          languages: go
      - name: Analyze
        uses: github/codeql-action/analyze@6f5948dfacef28e207b48d0905cf90c03365536d # v3
