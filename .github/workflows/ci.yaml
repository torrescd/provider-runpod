name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  GO_VERSION: 1.25.13
  CROSSPLANE_CLI_VERSION: v2.5.0
  CROSSPLANE_CLI_SHA256: 065dd6b40c9ea5fc71e49900d5c924cc0bec7f58375922ddbde6b402f292347e
  ACTIONLINT_VERSION: 1.7.12
  ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
  BUILDX_VERSION: v0.36.1
  BUILDKIT_IMAGE: docker.io/moby/buildkit@sha256:28a898719c18a33f4e8000685287fa36fd0dd9560c6440227d3a732d79bb41d8
  QEMU_IMAGE: docker.io/tonistiigi/binfmt@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0
  TRIVY_VERSION: v0.74.0
  TRIVY_SHA256: 2ae6fe3ee734b7fdf11335663e18c75ea12dccc76062f09f164a3b0f8be4371a
  SYFT_VERSION: v1.42.3
  SYFT_SHA256: 0d6be741479eddd2c8644a288990c04f3df0d609bbc1599a005532a9dff63509

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Verify formatting
        shell: bash
        run: test -z "$(gofmt -l ./apis ./cmd ./internal)"
      - name: Unit and fake-controller tests
        run: go test -race -coverprofile=coverage.out ./...
      - name: Vet
        run: go vet ./...
      - name: Build binaries
        env:
          CGO_ENABLED: "0"
        run: |
          go build -trimpath -ldflags='-s -w' ./cmd/provider
          go build -trimpath -ldflags='-s -w' ./cmd/model-router

  envtest:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Controller envtest with checksum-verified Kubernetes 1.35.0 assets
        run: go test -race -count=1 -tags=envtest -run '^TestEnvtest' ./internal/controller/endpointcheck

  generated:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Regenerate APIs and CRDs
        run: |
          go mod tidy
          go generate ./apis
      - name: Upload generated tree for review
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: generated-${{ github.sha }}
          path: |
            apis/**/zz_generated.*.go
            package/crds/*.yaml
            go.mod
            go.sum
      - name: Generated files are committed
        run: git diff --exit-code

  release-dry-run:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Install checksum-verified actionlint and validate workflows
        shell: bash
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/actionlint.tar.gz"
          install_dir="${RUNNER_TEMP}/actionlint"
          mkdir -p "${install_dir}"
          curl --fail --silent --show-error --location --retry 3 --output "${archive}" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          printf '%s  %s\n' "${ACTIONLINT_SHA256}" "${archive}" | sha256sum --check --strict
          tar -xzf "${archive}" -C "${install_dir}" actionlint
          "${install_dir}/actionlint" .github/workflows/*.yaml

      - name: Build release binaries
        shell: bash
        run: |
          set -euo pipefail
          for arch in amd64 arm64; do
            mkdir -p "bin/linux_${arch}"
            CGO_ENABLED=0 GOOS=linux GOARCH="${arch}" go build -trimpath -ldflags="-s -w -X github.com/torrescd/provider-runpod/internal/version.Version=v0.0.0-ci" -o "bin/linux_${arch}/provider" ./cmd/provider
            CGO_ENABLED=0 GOOS=linux GOARCH="${arch}" go build -trimpath -ldflags="-s -w" -o "bin/linux_${arch}/model-router" ./cmd/model-router
          done

      - name: Set up pinned QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
        with:
          image: ${{ env.QEMU_IMAGE }}
          platforms: arm64

      - name: Set up pinned Buildx and BuildKit
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
        with:
          version: ${{ env.BUILDX_VERSION }}
          driver-opts: |
            image=${{ env.BUILDKIT_IMAGE }}

      - name: Install checksum-verified Crossplane CLI
        shell: bash
        run: |
          set -euo pipefail
          install_dir="${RUNNER_TEMP}/provider-runpod-tools"
          mkdir -p "${install_dir}"
          cli="${install_dir}/crossplane"
          curl --fail --silent --show-error --location --retry 3 --output "${cli}" \
            "https://cli.crossplane.io/stable/${CROSSPLANE_CLI_VERSION}/bin/linux_amd64/crossplane"
          printf '%s  %s\n' "${CROSSPLANE_CLI_SHA256}" "${cli}" | sha256sum --check --strict
          chmod 0755 "${cli}"
          echo "${install_dir}" >> "${GITHUB_PATH}"
          "${cli}" version --client

      - name: Build provider packages and router image without publishing
        shell: bash
        run: |
          set -euo pipefail
          output_dir="dist/release-dry-run"
          bash hack/release/build-xpkgs.sh v0.0.0-ci "${output_dir}"
          docker buildx build \
            --file cluster/images/model-router/Dockerfile \
            --platform linux/amd64 \
            --provenance=false \
            --sbom=false \
            --output "type=docker,dest=${output_dir}/model-router-linux-amd64.tar" \
            .
          tar -tf "${output_dir}/provider-runpod-v0.0.0-ci-linux-amd64.xpkg" >/dev/null
          tar -tf "${output_dir}/provider-runpod-v0.0.0-ci-linux-arm64.xpkg" >/dev/null

      - name: Install checksum-verified Trivy
        shell: bash
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/trivy.tar.gz"
          install_dir="${RUNNER_TEMP}/trivy"
          mkdir -p "${install_dir}"
          curl --fail --silent --show-error --location --retry 3 --output "${archive}" \
            "https://github.com/aquasecurity/trivy/releases/download/${TRIVY_VERSION}/trivy_${TRIVY_VERSION#v}_Linux-64bit.tar.gz"
          printf '%s  %s\n' "${TRIVY_SHA256}" "${archive}" | sha256sum --check --strict
          tar -xzf "${archive}" -C "${install_dir}" trivy
          chmod 0755 "${install_dir}/trivy"
          echo "${install_dir}" >> "${GITHUB_PATH}"
          "${install_dir}/trivy" --version

      - name: Dry-run scan provider package
        uses: aquasecurity/trivy-action@b6643a29fecd7f34b3597bc6acb0a98b03d33ff8 # v0.33.1
        with:
          version: ${{ env.TRIVY_VERSION }}
          skip-setup-trivy: true
          input: dist/release-dry-run/provider-runpod-v0.0.0-ci-linux-amd64.xpkg
          scanners: vuln,secret
          format: sarif
          output: trivy-release-dry-run-provider-package.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: false
          limit-severities-for-sarif: true
          exit-code: "1"

      - name: Dry-run scan embedded provider runtime
        uses: aquasecurity/trivy-action@b6643a29fecd7f34b3597bc6acb0a98b03d33ff8 # v0.33.1
        with:
          version: ${{ env.TRIVY_VERSION }}
          skip-setup-trivy: true
          input: dist/release-dry-run/provider-runtime-linux-amd64.tar
          scanners: vuln,secret
          format: sarif
          output: trivy-release-dry-run-provider-runtime.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: false
          limit-severities-for-sarif: true
          exit-code: "1"

      - name: Dry-run scan model-router image
        uses: aquasecurity/trivy-action@b6643a29fecd7f34b3597bc6acb0a98b03d33ff8 # v0.33.1
        with:
          version: ${{ env.TRIVY_VERSION }}
          skip-setup-trivy: true
          input: dist/release-dry-run/model-router-linux-amd64.tar
          scanners: vuln,secret
          format: sarif
          output: trivy-release-dry-run-model-router.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: false
          limit-severities-for-sarif: true
          exit-code: "1"

      - name: Install checksum-verified Syft
        shell: bash
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/syft.tar.gz"
          install_dir="${RUNNER_TEMP}/syft"
          mkdir -p "${install_dir}"
          curl --fail --silent --show-error --location --retry 3 --output "${archive}" \
            "https://github.com/anchore/syft/releases/download/${SYFT_VERSION}/syft_${SYFT_VERSION#v}_linux_amd64.tar.gz"
          printf '%s  %s\n' "${SYFT_SHA256}" "${archive}" | sha256sum --check --strict
          tar -xzf "${archive}" -C "${install_dir}" syft
          chmod 0755 "${install_dir}/syft"
          echo "${install_dir}" >> "${GITHUB_PATH}"
          "${install_dir}/syft" version

      - name: Dry-run generate SPDX SBOMs
        shell: bash
        run: |
          set -euo pipefail
          syft scan docker-archive:dist/release-dry-run/provider-runpod-v0.0.0-ci-linux-amd64.xpkg --output spdx-json=sbom-release-dry-run-provider-package.spdx.json
          syft scan docker-archive:dist/release-dry-run/provider-runtime-linux-amd64.tar --output spdx-json=sbom-release-dry-run-provider-runtime.spdx.json

      - name: Prove Syft parsed the full xpkg and included its runtime packages
        shell: bash
        run: |
          set -euo pipefail
          jq -e \
            --slurpfile runtime sbom-release-dry-run-provider-runtime.spdx.json \
            '
              def package_key: [.name, (.versionInfo // ""), (.downloadLocation // "")];
              def packages_without_source: [.packages[] | select(.primaryPackagePurpose != "CONTAINER") | package_key];
              (.spdxVersion == "SPDX-2.3") and
              ($runtime[0].spdxVersion == "SPDX-2.3") and
              ((packages_without_source | length) > 0) and
              (($runtime[0] | packages_without_source | length) > 0) and
              ((($runtime[0] | packages_without_source) - packages_without_source) | length == 0)
            ' sbom-release-dry-run-provider-package.spdx.json >/dev/null

      - name: Upload release dry-run evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-dry-run-${{ github.sha }}
          path: |
            dist/release-dry-run/*.xpkg
            trivy-release-dry-run-*.sarif
            sbom-release-dry-run-*.spdx.json

  codeql:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
      packages: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Initialize CodeQL
        uses: github/codeql-action/init@6f5948dfacef28e207b48d0905cf90c03365536d # v3
        with:
          languages: go
      - name: Autobuild
        uses: github/codeql-action/autobuild@6f5948dfacef28e207b48d0905cf90c03365536d # v3
      - name: Analyze
        uses: github/codeql-action/analyze@6f5948dfacef28e207b48d0905cf90c03365536d # v3
