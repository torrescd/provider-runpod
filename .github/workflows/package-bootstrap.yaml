name: Bootstrap GHCR Packages

on:
  workflow_dispatch:

permissions: {}

env:
  GO_VERSION: 1.25.13
  CROSSPLANE_CLI_VERSION: v2.5.0
  CROSSPLANE_CLI_SHA256: 065dd6b40c9ea5fc71e49900d5c924cc0bec7f58375922ddbde6b402f292347e
  BUILDX_VERSION: v0.36.1
  BUILDKIT_IMAGE: docker.io/moby/buildkit@sha256:28a898719c18a33f4e8000685287fa36fd0dd9560c6440227d3a732d79bb41d8
  QEMU_IMAGE: docker.io/tonistiigi/binfmt@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0
  TRIVY_VERSION: v0.74.0
  TRIVY_SHA256: 2ae6fe3ee734b7fdf11335663e18c75ea12dccc76062f09f164a3b0f8be4371a
  CONTROLLER_IMAGE: ghcr.io/torrescd/provider-runpod-controller
  ROUTER_IMAGE: ghcr.io/torrescd/provider-runpod-model-router
  PACKAGE_IMAGE: ghcr.io/torrescd/provider-runpod
  BOOTSTRAP_DIR: dist/bootstrap
  BOOTSTRAP_VERSION: v0.0.0-bootstrap.${{ github.sha }}

jobs:
  build:
    name: Unprivileged build, test, and scan
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    permissions:
      actions: read
      contents: read
    outputs:
      artifact_id: ${{ steps.bundle.outputs.artifact-id }}
      artifact_digest: ${{ steps.bundle.outputs.artifact-digest }}
    steps:
      - name: Checkout main exactly without persisted credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false

      - name: Require untagged main
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          test "${GITHUB_REF}" = refs/heads/main
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          if git rev-parse --verify --quiet refs/tags/v0.1.0 >/dev/null; then
            echo "v0.1.0 already exists; package bootstrap is only a pre-release visibility step" >&2
            exit 1
          fi
          test -z "$(git status --porcelain)"
          successful_ci="$(gh api \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "/repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yaml/runs?branch=main&event=push&status=completed&head_sha=${GITHUB_SHA}&per_page=100" \
            --jq '[.workflow_runs[] | select(.head_sha == env.GITHUB_SHA and .head_branch == "main" and .event == "push" and .conclusion == "success")] | length')"
          test "${successful_ci}" -ge 1

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Test and build both architectures
        shell: bash
        run: |
          set -euo pipefail
          go test -race ./...
          go vet ./...
          for arch in amd64 arm64; do
            mkdir -p "bin/linux_${arch}"
            CGO_ENABLED=0 GOOS=linux GOARCH="${arch}" go build -trimpath -ldflags="-s -w -X github.com/torrescd/provider-runpod/internal/version.Version=${BOOTSTRAP_VERSION}" -o "bin/linux_${arch}/provider" ./cmd/provider
            CGO_ENABLED=0 GOOS=linux GOARCH="${arch}" go build -trimpath -ldflags="-s -w" -o "bin/linux_${arch}/model-router" ./cmd/model-router
          done
          if go list -deps ./cmd/provider | grep -E '/(endpointcheck|inference)$'; then
            echo 'provider binary contains inference-verifier code' >&2
            exit 1
          fi
          if go list -deps ./cmd/model-router | grep -E '/(management|client/runpod)$'; then
            echo 'model-router binary contains management-client code' >&2
            exit 1
          fi

      - name: Set up pinned QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
        with:
          image: ${{ env.QEMU_IMAGE }}
          platforms: arm64

      - name: Set up pinned Buildx and BuildKit
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
        with:
          version: ${{ env.BUILDX_VERSION }}
          driver-opts: |
            image=${{ env.BUILDKIT_IMAGE }}

      - name: Install checksum-verified Crossplane CLI
        shell: bash
        run: |
          set -euo pipefail
          install_dir="${RUNNER_TEMP}/provider-runpod-tools"
          mkdir -p "${install_dir}"
          cli="${install_dir}/crossplane"
          curl --fail --silent --show-error --location --retry 3 --output "${cli}" \
            "https://cli.crossplane.io/stable/${CROSSPLANE_CLI_VERSION}/bin/linux_amd64/crossplane"
          printf '%s  %s\n' "${CROSSPLANE_CLI_SHA256}" "${cli}" | sha256sum --check --strict
          chmod 0755 "${cli}"
          echo "${install_dir}" >> "${GITHUB_PATH}"
          "${cli}" version --client

      - name: Build final local provider packages and runtime archives
        shell: bash
        run: |
          set -euo pipefail
          bash hack/release/build-xpkgs.sh "${BOOTSTRAP_VERSION}" "${BOOTSTRAP_DIR}"
          version="${BOOTSTRAP_VERSION#v}"
          for arch in amd64 arm64; do
            docker buildx build \
              --file cluster/images/model-router/Dockerfile \
              --platform "linux/${arch}" \
              --provenance=false \
              --sbom=false \
              --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
              --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
              --label "org.opencontainers.image.version=${BOOTSTRAP_VERSION}" \
              --label "org.opencontainers.image.licenses=Apache-2.0" \
              --tag "provider-runpod-model-router:${version}-${arch}" \
              --output "type=docker,dest=${BOOTSTRAP_DIR}/model-router-linux-${arch}.tar" \
              .
          done

      - name: Install checksum-verified Trivy
        shell: bash
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/trivy.tar.gz"
          install_dir="${RUNNER_TEMP}/trivy"
          mkdir -p "${install_dir}"
          curl --fail --silent --show-error --location --retry 3 --output "${archive}" \
            "https://github.com/aquasecurity/trivy/releases/download/${TRIVY_VERSION}/trivy_${TRIVY_VERSION#v}_Linux-64bit.tar.gz"
          printf '%s  %s\n' "${TRIVY_SHA256}" "${archive}" | sha256sum --check --strict
          tar -xzf "${archive}" -C "${install_dir}" trivy
          chmod 0755 "${install_dir}/trivy"
          echo "${install_dir}" >> "${GITHUB_PATH}"
          "${install_dir}/trivy" --version

      - name: Scan every final local image and package before publication
        shell: bash
        run: |
          set -euo pipefail
          for arch in amd64 arm64; do
            trivy image --input "${BOOTSTRAP_DIR}/provider-runtime-linux-${arch}.tar" \
              --scanners vuln,secret --format sarif --output "trivy-bootstrap-provider-linux-${arch}.sarif" \
              --severity CRITICAL,HIGH --ignore-unfixed=false --exit-code 1
            trivy image --input "${BOOTSTRAP_DIR}/model-router-linux-${arch}.tar" \
              --scanners vuln,secret --format sarif --output "trivy-bootstrap-model-router-linux-${arch}.sarif" \
              --severity CRITICAL,HIGH --ignore-unfixed=false --exit-code 1
            trivy image --input "${BOOTSTRAP_DIR}/provider-runpod-${BOOTSTRAP_VERSION}-linux-${arch}.xpkg" \
              --scanners vuln,secret --format sarif --output "trivy-bootstrap-package-linux-${arch}.sarif" \
              --severity CRITICAL,HIGH --ignore-unfixed=false --exit-code 1
          done

      - name: Integrity-bind bootstrap handoff
        shell: bash
        run: |
          set -euo pipefail
          sha256sum "${BOOTSTRAP_DIR}"/*.tar "${BOOTSTRAP_DIR}"/*.xpkg trivy-bootstrap-*.sarif > BUILD-SHA256SUMS
          sha256sum --check --strict BUILD-SHA256SUMS

      - name: Upload immutable bootstrap handoff
        id: bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: package-bootstrap-handoff-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
          path: |
            dist/bootstrap/*.tar
            dist/bootstrap/*.xpkg
            trivy-bootstrap-*.sarif
            BUILD-SHA256SUMS

  publish:
    name: Minimal no-checkout package-record publisher
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      actions: read
      packages: write
    steps:
      - name: Set up pinned Buildx and BuildKit
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
        with:
          version: ${{ env.BUILDX_VERSION }}
          driver-opts: |
            image=${{ env.BUILDKIT_IMAGE }}

      - name: Authenticated raw download and exact ZIP validation
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ARTIFACT_ID: ${{ needs.build.outputs.artifact_id }}
          EXPECTED_ARTIFACT_DIGEST: ${{ needs.build.outputs.artifact_digest }}
        run: |
          set -euo pipefail
          [[ "${ARTIFACT_ID}" =~ ^[1-9][0-9]*$ ]]
          raw_expected="${EXPECTED_ARTIFACT_DIGEST}"
          if [[ "${raw_expected}" =~ ^[0-9a-f]{64}$ ]]; then
            expected="sha256:${raw_expected}"
          elif [[ "${raw_expected}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            expected="${raw_expected}"
          else
            echo 'upload-artifact returned an invalid artifact digest' >&2
            exit 1
          fi
          [[ "${expected}" =~ ^sha256:[0-9a-f]{64}$ ]]
          metadata="$(gh api -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}")"
          test "$(jq -r .expired <<<"${metadata}")" = false
          test "$(jq -r .digest <<<"${metadata}")" = "${expected}"
          test "$(jq -r .workflow_run.head_sha <<<"${metadata}")" = "${GITHUB_SHA}"
          test "$(jq -r .workflow_run.id <<<"${metadata}")" = "${GITHUB_RUN_ID}"
          test "$(jq -r .name <<<"${metadata}")" = "package-bootstrap-handoff-${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          curl --fail --silent --show-error --location --retry 3 \
            -H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' --output handoff.zip \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip"
          actual="sha256:$(sha256sum handoff.zip | awk '{print $1}')"
          test "${actual}" = "${expected}"

          python3 - <<'PY'
          import os, pathlib, stat, zipfile
          sha = os.environ["GITHUB_SHA"]
          version = f"v0.0.0-bootstrap.{sha}"
          expected = {"BUILD-SHA256SUMS"}
          for arch in ("amd64", "arm64"):
              expected.update({
                  f"dist/bootstrap/provider-runtime-linux-{arch}.tar",
                  f"dist/bootstrap/model-router-linux-{arch}.tar",
                  f"dist/bootstrap/provider-runpod-{version}-linux-{arch}.xpkg",
                  f"trivy-bootstrap-provider-linux-{arch}.sarif",
                  f"trivy-bootstrap-model-router-linux-{arch}.sarif",
                  f"trivy-bootstrap-package-linux-{arch}.sarif",
              })
          with zipfile.ZipFile("handoff.zip") as archive:
              infos = archive.infolist()
              names = [entry.filename for entry in infos]
              if len(names) != len(set(names)) or set(names) != expected:
                  raise SystemExit(f"unexpected or duplicate handoff entries: {sorted(names)}")
              total = 0
              for entry in infos:
                  path = pathlib.PurePosixPath(entry.filename)
                  mode = (entry.external_attr >> 16) & 0xFFFF
                  if path.is_absolute() or ".." in path.parts or "\\" in entry.filename or entry.is_dir():
                      raise SystemExit(f"unsafe handoff path: {entry.filename!r}")
                  if mode and (stat.S_ISLNK(mode) or not stat.S_ISREG(mode)):
                      raise SystemExit(f"non-regular handoff entry: {entry.filename!r}")
                  total += entry.file_size
              if total > 3 * 1024 * 1024 * 1024:
                  raise SystemExit("handoff exceeds uncompressed size bound")
              archive.extractall("bundle")
          PY

      - name: Verify every handed-off byte and file
        shell: bash
        working-directory: bundle
        run: |
          set -euo pipefail
          test -z "$(find . -type l -print -quit)"
          sha256sum --check --strict BUILD-SHA256SUMS
          test "$(find dist/bootstrap -maxdepth 1 -type f -name '*.xpkg' | wc -l)" -eq 2
          test "$(find dist/bootstrap -maxdepth 1 -type f -name '*.tar' | wc -l)" -eq 4
          test "$(find . -maxdepth 1 -type f -name 'trivy-bootstrap-*.sarif' | wc -l)" -eq 6

      - name: Install checksum-verified Crossplane CLI
        shell: bash
        run: |
          set -euo pipefail
          install_dir="${RUNNER_TEMP}/provider-runpod-tools"
          mkdir -p "${install_dir}"
          cli="${install_dir}/crossplane"
          curl --fail --silent --show-error --location --retry 3 --output "${cli}" \
            "https://cli.crossplane.io/stable/${CROSSPLANE_CLI_VERSION}/bin/linux_amd64/crossplane"
          printf '%s  %s\n' "${CROSSPLANE_CLI_SHA256}" "${cli}" | sha256sum --check --strict
          chmod 0755 "${cli}"
          echo "${install_dir}" >> "${GITHUB_PATH}"
          "${cli}" version --client

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish exact scanned unsigned bootstrap candidates
        id: publish
        shell: bash
        working-directory: bundle
        run: |
          set -euo pipefail
          version="${BOOTSTRAP_VERSION#v}"
          push_platforms() {
            local image="$1" local_name="$2" archive_prefix="$3" output_prefix="$4"
            local digests=()
            for arch in amd64 arm64; do
              docker load --input "${BOOTSTRAP_DIR}/${archive_prefix}-linux-${arch}.tar" >/dev/null
              docker tag "${local_name}:${version}-${arch}" "${image}:${BOOTSTRAP_VERSION}-${arch}"
              docker push "${image}:${BOOTSTRAP_VERSION}-${arch}" >/dev/null
              digest="$(docker buildx imagetools inspect "${image}:${BOOTSTRAP_VERSION}-${arch}" --format '{{json .Manifest.Digest}}' | tr -d '"')"
              [[ "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]]
              digests+=("${digest}")
            done
            docker buildx imagetools create --tag "${image}:${BOOTSTRAP_VERSION}" "${image}@${digests[0]}" "${image}@${digests[1]}"
            digest="$(docker buildx imagetools inspect "${image}:${BOOTSTRAP_VERSION}" --format '{{json .Manifest.Digest}}' | tr -d '"')"
            [[ "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]]
            echo "${output_prefix}_digest=${digest}" >> "${GITHUB_OUTPUT}"
          }
          push_platforms "${CONTROLLER_IMAGE}" provider-runpod-runtime provider-runtime controller
          push_platforms "${ROUTER_IMAGE}" provider-runpod-model-router model-router router

          crossplane xpkg push --package-files \
            "${BOOTSTRAP_DIR}/provider-runpod-${BOOTSTRAP_VERSION}-linux-amd64.xpkg,${BOOTSTRAP_DIR}/provider-runpod-${BOOTSTRAP_VERSION}-linux-arm64.xpkg" \
            "${PACKAGE_IMAGE}:${BOOTSTRAP_VERSION}"
          digest="$(docker buildx imagetools inspect "${PACKAGE_IMAGE}:${BOOTSTRAP_VERSION}" --format '{{json .Manifest.Digest}}' | tr -d '"')"
          [[ "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "package_digest=${digest}" >> "${GITHUB_OUTPUT}"

      - name: Record visibility bootstrap result
        shell: bash
        env:
          CONTROLLER_DIGEST: ${{ steps.publish.outputs.controller_digest }}
          ROUTER_DIGEST: ${{ steps.publish.outputs.router_digest }}
          PACKAGE_DIGEST: ${{ steps.publish.outputs.package_digest }}
        run: |
          set -euo pipefail
          {
            echo '### GHCR package bootstrap'
            echo
            echo 'These unsigned, scanned candidates exist only to create the three GHCR package records.'
            echo 'Set each package to Public in the GitHub package settings UI, then verify anonymous access before creating v0.1.0.'
            echo
            echo "- ${PACKAGE_IMAGE}@${PACKAGE_DIGEST}"
            echo "- ${CONTROLLER_IMAGE}@${CONTROLLER_DIGEST}"
            echo "- ${ROUTER_IMAGE}@${ROUTER_DIGEST}"
          } >> "${GITHUB_STEP_SUMMARY}"
