          test "$(resolve_tag_commit)" = "${GITHUB_SHA}"
          tagged_digest() {
            local package="$1" tag="$2"
            local matches=()
            mapfile -t matches < <(gh api --paginate \
              -H 'Accept: application/vnd.github+json' \
