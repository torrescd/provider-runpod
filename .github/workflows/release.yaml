name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write

env:
  GO_VERSION: 1.25.13
  CROSSPLANE_CLI_VERSION: v2.5.0
  CROSSPLANE_CLI_SHA256: 065dd6b40c9ea5fc71e49900d5c924cc0bec7f58375922ddbde6b402f292347e
  BUILDX_VERSION: v0.36.1
  BUILDKIT_IMAGE: docker.io/moby/buildkit@sha256:28a898719c18a33f4e8000685287fa36fd0dd9560c6440227d3a732d79bb41d8
  QEMU_IMAGE: docker.io/tonistiigi/binfmt@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0
  TRIVY_VERSION: v0.74.0
  TRIVY_SHA256: 2ae6fe3ee734b7fdf11335663e18c75ea12dccc76062f09f164a3b0f8be4371a
  SYFT_VERSION: v1.42.3
  SYFT_SHA256: 0d6be741479eddd2c8644a288990c04f3df0d609bbc1599a005532a9dff63509
  CONTROLLER_IMAGE: ghcr.io/torrescd/provider-runpod-controller
  ROUTER_IMAGE: ghcr.io/torrescd/provider-runpod-model-router
  PACKAGE_IMAGE: ghcr.io/torrescd/provider-runpod
  RELEASE_DIR: dist/release
  SIGNING_IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/release.yaml@refs/tags/${{ github.ref_name }}
  SIGNING_ISSUER: https://token.actions.githubusercontent.com

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout exact tag
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Validate immutable semver source
        shell: bash
        run: |
          set -euo pipefail
          [[ "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "$(git rev-list -n1 "${GITHUB_REF_NAME}")" = "${GITHUB_SHA}"
          test -z "$(git status --porcelain)"

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Test and build both architectures
        shell: bash
        run: |
          set -euo pipefail
          go test ./...
          for arch in amd64 arm64; do
            mkdir -p "bin/linux_${arch}"
            CGO_ENABLED=0 GOOS=linux GOARCH="${arch}" go build -trimpath -ldflags="-s -w -X github.com/torrescd/provider-runpod/internal/version.Version=${GITHUB_REF_NAME}" -o "bin/linux_${arch}/provider" ./cmd/provider
            CGO_ENABLED=0 GOOS=linux GOARCH="${arch}" go build -trimpath -ldflags="-s -w" -o "bin/linux_${arch}/model-router" ./cmd/model-router
          done

      - name: Set up pinned QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
        with:
          image: ${{ env.QEMU_IMAGE }}
          platforms: arm64

      - name: Set up pinned Buildx and BuildKit
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
        with:
          version: ${{ env.BUILDX_VERSION }}
          driver-opts: |
            image=${{ env.BUILDKIT_IMAGE }}

      - name: Install checksum-verified Crossplane CLI
        shell: bash
        run: |
          set -euo pipefail
          install_dir="${RUNNER_TEMP}/provider-runpod-tools"
          mkdir -p "${install_dir}"
          cli="${install_dir}/crossplane"
          curl --fail --silent --show-error --location --retry 3 \
            --output "${cli}" \
            "https://cli.crossplane.io/stable/${CROSSPLANE_CLI_VERSION}/bin/linux_amd64/crossplane"
          printf '%s  %s\n' "${CROSSPLANE_CLI_SHA256}" "${cli}" | sha256sum --check --strict
          chmod 0755 "${cli}"
          echo "${install_dir}" >> "${GITHUB_PATH}"
          "${cli}" version --client

      - name: Build architecture-specific Crossplane packages
        shell: bash
        run: bash hack/release/build-xpkgs.sh "${GITHUB_REF_NAME}" "${RELEASE_DIR}"

      - name: Preflight public GHCR package records before publication
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          for package in provider-runpod provider-runpod-controller provider-runpod-model-router; do
            metadata="$(gh api \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "/users/${GITHUB_REPOSITORY_OWNER}/packages/container/${package}")"
            test "$(jq -r .visibility <<<"${metadata}")" = public
            test "$(jq -r .repository.full_name <<<"${metadata}")" = "${GITHUB_REPOSITORY}"
          done

          anonymous_docker_config="$(mktemp -d)"
          trap 'rm -rf "${anonymous_docker_config}"' EXIT
          bootstrap_version="v0.0.0-bootstrap.${GITHUB_SHA}"
          for artifact in \
            "${PACKAGE_IMAGE}:${bootstrap_version}" \
            "${CONTROLLER_IMAGE}:${bootstrap_version}" \
            "${ROUTER_IMAGE}:${bootstrap_version}"; do
            DOCKER_CONFIG="${anonymous_docker_config}" docker buildx imagetools inspect "${artifact}" >/dev/null
          done

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push controller
        id: controller
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: cluster/images/provider-runpod/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          sbom: false
          tags: |
            ${{ env.CONTROLLER_IMAGE }}:${{ github.ref_name }}
            ${{ env.CONTROLLER_IMAGE }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}
            org.opencontainers.image.licenses=Apache-2.0

      - name: Build and push model-router
        id: router
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: cluster/images/model-router/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          sbom: false
          tags: |
            ${{ env.ROUTER_IMAGE }}:${{ github.ref_name }}
            ${{ env.ROUTER_IMAGE }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}
            org.opencontainers.image.licenses=Apache-2.0

      - name: Resolve and validate platform digests
        id: platforms
        shell: bash
        env:
          CONTROLLER_DIGEST: ${{ steps.controller.outputs.digest }}
          ROUTER_DIGEST: ${{ steps.router.outputs.digest }}
        run: |
          set -euo pipefail
          resolve_platform() {
            local image="$1" digest="$2" arch="$3"
            docker buildx imagetools inspect "${image}@${digest}" --raw |
              jq -er --arg arch "${arch}" '
                [.manifests[] | select(.platform.os == "linux" and .platform.architecture == $arch) | .digest]
                | if length == 1 then .[0] else error("expected exactly one linux/" + $arch + " manifest") end'
          }
          [[ "${CONTROLLER_DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "${ROUTER_DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]]
          {
            echo "controller_amd64=$(resolve_platform "${CONTROLLER_IMAGE}" "${CONTROLLER_DIGEST}" amd64)"
            echo "controller_arm64=$(resolve_platform "${CONTROLLER_IMAGE}" "${CONTROLLER_DIGEST}" arm64)"
            echo "router_amd64=$(resolve_platform "${ROUTER_IMAGE}" "${ROUTER_DIGEST}" amd64)"
            echo "router_arm64=$(resolve_platform "${ROUTER_IMAGE}" "${ROUTER_DIGEST}" arm64)"
          } >> "${GITHUB_OUTPUT}"

      - name: Install checksum-verified Trivy
        shell: bash
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/trivy.tar.gz"
          install_dir="${RUNNER_TEMP}/trivy"
          mkdir -p "${install_dir}"
          curl --fail --silent --show-error --location --retry 3 --output "${archive}" \
            "https://github.com/aquasecurity/trivy/releases/download/${TRIVY_VERSION}/trivy_${TRIVY_VERSION#v}_Linux-64bit.tar.gz"
          printf '%s  %s\n' "${TRIVY_SHA256}" "${archive}" | sha256sum --check --strict
          tar -xzf "${archive}" -C "${install_dir}" trivy
          chmod 0755 "${install_dir}/trivy"
          echo "${install_dir}" >> "${GITHUB_PATH}"
          "${install_dir}/trivy" --version

      - name: Scan controller linux-amd64 before signing
        uses: aquasecurity/trivy-action@b6643a29fecd7f34b3597bc6acb0a98b03d33ff8 # v0.33.1
        with:
          version: ${{ env.TRIVY_VERSION }}
          skip-setup-trivy: true
          image-ref: ${{ env.CONTROLLER_IMAGE }}@${{ steps.platforms.outputs.controller_amd64 }}
          scanners: vuln,secret
          format: sarif
          output: trivy-controller-linux-amd64.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: false
          limit-severities-for-sarif: true
          exit-code: "1"

      - name: Scan controller linux-arm64 before signing
        uses: aquasecurity/trivy-action@b6643a29fecd7f34b3597bc6acb0a98b03d33ff8 # v0.33.1
        with:
          version: ${{ env.TRIVY_VERSION }}
          skip-setup-trivy: true
          image-ref: ${{ env.CONTROLLER_IMAGE }}@${{ steps.platforms.outputs.controller_arm64 }}
          scanners: vuln,secret
          format: sarif
          output: trivy-controller-linux-arm64.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: false
          limit-severities-for-sarif: true
          exit-code: "1"

      - name: Scan model-router linux-amd64 before signing
        uses: aquasecurity/trivy-action@b6643a29fecd7f34b3597bc6acb0a98b03d33ff8 # v0.33.1
        with:
          version: ${{ env.TRIVY_VERSION }}
          skip-setup-trivy: true
          image-ref: ${{ env.ROUTER_IMAGE }}@${{ steps.platforms.outputs.router_amd64 }}
          scanners: vuln,secret
          format: sarif
          output: trivy-model-router-linux-amd64.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: false
          limit-severities-for-sarif: true
          exit-code: "1"

      - name: Scan model-router linux-arm64 before signing
        uses: aquasecurity/trivy-action@b6643a29fecd7f34b3597bc6acb0a98b03d33ff8 # v0.33.1
        with:
          version: ${{ env.TRIVY_VERSION }}
          skip-setup-trivy: true
          image-ref: ${{ env.ROUTER_IMAGE }}@${{ steps.platforms.outputs.router_arm64 }}
          scanners: vuln,secret
          format: sarif
          output: trivy-model-router-linux-arm64.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: false
          limit-severities-for-sarif: true
          exit-code: "1"

      - name: Scan embedded provider runtime linux-amd64 before publishing or signing
        uses: aquasecurity/trivy-action@b6643a29fecd7f34b3597bc6acb0a98b03d33ff8 # v0.33.1
        with:
          version: ${{ env.TRIVY_VERSION }}
          skip-setup-trivy: true
          input: ${{ env.RELEASE_DIR }}/provider-runtime-linux-amd64.tar
          scanners: vuln,secret
          format: sarif
          output: trivy-provider-runtime-linux-amd64.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: false
          limit-severities-for-sarif: true
          exit-code: "1"

      - name: Scan embedded provider runtime linux-arm64 before publishing or signing
        uses: aquasecurity/trivy-action@b6643a29fecd7f34b3597bc6acb0a98b03d33ff8 # v0.33.1
        with:
          version: ${{ env.TRIVY_VERSION }}
          skip-setup-trivy: true
          input: ${{ env.RELEASE_DIR }}/provider-runtime-linux-arm64.tar
          scanners: vuln,secret
          format: sarif
          output: trivy-provider-runtime-linux-arm64.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: false
          limit-severities-for-sarif: true
          exit-code: "1"

      - name: Scan provider package linux-amd64 before publishing or signing
        uses: aquasecurity/trivy-action@b6643a29fecd7f34b3597bc6acb0a98b03d33ff8 # v0.33.1
        with:
          version: ${{ env.TRIVY_VERSION }}
          skip-setup-trivy: true
          input: ${{ env.RELEASE_DIR }}/provider-runpod-${{ github.ref_name }}-linux-amd64.xpkg
          scanners: vuln,secret
          format: sarif
          output: trivy-provider-package-linux-amd64.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: false
          limit-severities-for-sarif: true
          exit-code: "1"

      - name: Scan provider package linux-arm64 before publishing or signing
        uses: aquasecurity/trivy-action@b6643a29fecd7f34b3597bc6acb0a98b03d33ff8 # v0.33.1
        with:
          version: ${{ env.TRIVY_VERSION }}
          skip-setup-trivy: true
          input: ${{ env.RELEASE_DIR }}/provider-runpod-${{ github.ref_name }}-linux-arm64.xpkg
          scanners: vuln,secret
          format: sarif
          output: trivy-provider-package-linux-arm64.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: false
          limit-severities-for-sarif: true
          exit-code: "1"

      - name: Install checksum-verified Syft
        shell: bash
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/syft.tar.gz"
          install_dir="${RUNNER_TEMP}/syft"
          mkdir -p "${install_dir}"
          curl --fail --silent --show-error --location --retry 3 --output "${archive}" \
            "https://github.com/anchore/syft/releases/download/${SYFT_VERSION}/syft_${SYFT_VERSION#v}_linux_amd64.tar.gz"
          printf '%s  %s\n' "${SYFT_SHA256}" "${archive}" | sha256sum --check --strict
          tar -xzf "${archive}" -C "${install_dir}" syft
          chmod 0755 "${install_dir}/syft"
          echo "${install_dir}" >> "${GITHUB_PATH}"
          "${install_dir}/syft" version

      - name: Generate per-platform SPDX SBOMs
        shell: bash
        run: |
          set -euo pipefail
          syft scan "${CONTROLLER_IMAGE}@${{ steps.platforms.outputs.controller_amd64 }}" --output spdx-json=sbom-controller-linux-amd64.spdx.json
          syft scan "${CONTROLLER_IMAGE}@${{ steps.platforms.outputs.controller_arm64 }}" --output spdx-json=sbom-controller-linux-arm64.spdx.json
          syft scan "${ROUTER_IMAGE}@${{ steps.platforms.outputs.router_amd64 }}" --output spdx-json=sbom-model-router-linux-amd64.spdx.json
          syft scan "${ROUTER_IMAGE}@${{ steps.platforms.outputs.router_arm64 }}" --output spdx-json=sbom-model-router-linux-arm64.spdx.json
          syft scan "docker-archive:${RELEASE_DIR}/provider-runpod-${GITHUB_REF_NAME}-linux-amd64.xpkg" --output spdx-json=sbom-provider-package-linux-amd64.spdx.json
          syft scan "docker-archive:${RELEASE_DIR}/provider-runpod-${GITHUB_REF_NAME}-linux-arm64.xpkg" --output spdx-json=sbom-provider-package-linux-arm64.spdx.json
          syft scan "docker-archive:${RELEASE_DIR}/provider-runtime-linux-amd64.tar" --output spdx-json=sbom-provider-runtime-linux-amd64.spdx.json
          syft scan "docker-archive:${RELEASE_DIR}/provider-runtime-linux-arm64.tar" --output spdx-json=sbom-provider-runtime-linux-arm64.spdx.json

      - name: Prove package SBOMs include their embedded runtime packages
        shell: bash
        run: |
          set -euo pipefail
          for arch in amd64 arm64; do
            jq -e \
              --slurpfile runtime "sbom-provider-runtime-linux-${arch}.spdx.json" \
              '
                def package_key: [.name, (.versionInfo // ""), (.downloadLocation // "")];
                def packages_without_source: [.packages[] | select(.primaryPackagePurpose != "CONTAINER") | package_key];
                (.spdxVersion == "SPDX-2.3") and
                (($runtime[0].spdxVersion == "SPDX-2.3")) and
                ((packages_without_source | length) > 0) and
                (($runtime[0] | packages_without_source | length) > 0) and
                ((($runtime[0] | packages_without_source) - packages_without_source) | length == 0)
              ' "sbom-provider-package-linux-${arch}.spdx.json" >/dev/null
          done

      - name: Push scanned multi-architecture Crossplane package
        id: package
        shell: bash
        run: |
          set -euo pipefail
          amd64_xpkg="${RELEASE_DIR}/provider-runpod-${GITHUB_REF_NAME}-linux-amd64.xpkg"
          arm64_xpkg="${RELEASE_DIR}/provider-runpod-${GITHUB_REF_NAME}-linux-arm64.xpkg"
          crossplane xpkg push --package-files "${amd64_xpkg},${arm64_xpkg}" "${PACKAGE_IMAGE}:${GITHUB_REF_NAME}"
          package_digest="$(docker buildx imagetools inspect "${PACKAGE_IMAGE}:${GITHUB_REF_NAME}" --format '{{json .Manifest.Digest}}' | tr -d '"')"
          [[ "${package_digest}" =~ ^sha256:[0-9a-f]{64}$ ]]
          docker buildx imagetools inspect "${PACKAGE_IMAGE}@${package_digest}" --raw |
            jq -e '[.manifests[].platform | select(.os == "linux") | .architecture] | sort | . == ["amd64", "arm64"]' >/dev/null
          docker buildx imagetools inspect "${PACKAGE_IMAGE}@${package_digest}" --format '{{json .Image}}' |
            jq -e '
              (keys | sort) == ["linux/amd64", "linux/arm64"] and
              .["linux/amd64"].os == "linux" and
              .["linux/amd64"].architecture == "amd64" and
              .["linux/amd64"].config.User == "65532:65532" and
              .["linux/amd64"].config.Entrypoint == ["/usr/local/bin/crossplane-runpod-provider"] and
              .["linux/arm64"].os == "linux" and
              .["linux/arm64"].architecture == "arm64" and
              .["linux/arm64"].config.User == "65532:65532" and
              .["linux/arm64"].config.Entrypoint == ["/usr/local/bin/crossplane-runpod-provider"]
            ' >/dev/null
          echo "digest=${package_digest}" >> "${GITHUB_OUTPUT}"

      - name: Install Cosign
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3
        with:
          cosign-release: v3.0.5

      - name: Keyless sign all immutable artifacts
        shell: bash
        env:
          CONTROLLER_DIGEST: ${{ steps.controller.outputs.digest }}
          ROUTER_DIGEST: ${{ steps.router.outputs.digest }}
          PACKAGE_DIGEST: ${{ steps.package.outputs.digest }}
        run: |
          set -euo pipefail
          cosign sign --yes "${CONTROLLER_IMAGE}@${CONTROLLER_DIGEST}"
          cosign sign --yes "${ROUTER_IMAGE}@${ROUTER_DIGEST}"
          cosign sign --yes "${PACKAGE_IMAGE}@${PACKAGE_DIGEST}"

      - name: Verify exact keyless signing identity
        shell: bash
        env:
          CONTROLLER_DIGEST: ${{ steps.controller.outputs.digest }}
          ROUTER_DIGEST: ${{ steps.router.outputs.digest }}
          PACKAGE_DIGEST: ${{ steps.package.outputs.digest }}
        run: |
          set -euo pipefail
          cosign verify --certificate-identity "${SIGNING_IDENTITY}" --certificate-oidc-issuer "${SIGNING_ISSUER}" --output json "${CONTROLLER_IMAGE}@${CONTROLLER_DIGEST}" > cosign-verification-controller.json
          cosign verify --certificate-identity "${SIGNING_IDENTITY}" --certificate-oidc-issuer "${SIGNING_ISSUER}" --output json "${ROUTER_IMAGE}@${ROUTER_DIGEST}" > cosign-verification-model-router.json
          cosign verify --certificate-identity "${SIGNING_IDENTITY}" --certificate-oidc-issuer "${SIGNING_ISSUER}" --output json "${PACKAGE_IMAGE}@${PACKAGE_DIGEST}" > cosign-verification-provider-package.json

      - name: Attest controller SLSA provenance
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-name: ${{ env.CONTROLLER_IMAGE }}
          subject-digest: ${{ steps.controller.outputs.digest }}
          push-to-registry: true

      - name: Attest model-router SLSA provenance
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-name: ${{ env.ROUTER_IMAGE }}
          subject-digest: ${{ steps.router.outputs.digest }}
          push-to-registry: true

      - name: Attest provider package SLSA provenance
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-name: ${{ env.PACKAGE_IMAGE }}
          subject-digest: ${{ steps.package.outputs.digest }}
          push-to-registry: true

      - name: Attest controller linux-amd64 SPDX SBOM
        uses: actions/attest-sbom@4651f806c01d8637787e274ac3bdf724ef169f34 # v3
        with:
          subject-name: ${{ env.CONTROLLER_IMAGE }}
          subject-digest: ${{ steps.controller.outputs.digest }}
          sbom-path: sbom-controller-linux-amd64.spdx.json
          push-to-registry: true

      - name: Attest controller linux-arm64 SPDX SBOM
        uses: actions/attest-sbom@4651f806c01d8637787e274ac3bdf724ef169f34 # v3
        with:
          subject-name: ${{ env.CONTROLLER_IMAGE }}
          subject-digest: ${{ steps.controller.outputs.digest }}
          sbom-path: sbom-controller-linux-arm64.spdx.json
          push-to-registry: true

      - name: Attest model-router linux-amd64 SPDX SBOM
        uses: actions/attest-sbom@4651f806c01d8637787e274ac3bdf724ef169f34 # v3
        with:
          subject-name: ${{ env.ROUTER_IMAGE }}
          subject-digest: ${{ steps.router.outputs.digest }}
          sbom-path: sbom-model-router-linux-amd64.spdx.json
          push-to-registry: true

      - name: Attest model-router linux-arm64 SPDX SBOM
        uses: actions/attest-sbom@4651f806c01d8637787e274ac3bdf724ef169f34 # v3
        with:
          subject-name: ${{ env.ROUTER_IMAGE }}
          subject-digest: ${{ steps.router.outputs.digest }}
          sbom-path: sbom-model-router-linux-arm64.spdx.json
          push-to-registry: true

      - name: Attest provider package linux-amd64 SPDX SBOM
        uses: actions/attest-sbom@4651f806c01d8637787e274ac3bdf724ef169f34 # v3
        with:
          subject-name: ${{ env.PACKAGE_IMAGE }}
          subject-digest: ${{ steps.package.outputs.digest }}
          sbom-path: sbom-provider-package-linux-amd64.spdx.json
          push-to-registry: true

      - name: Attest provider package linux-arm64 SPDX SBOM
        uses: actions/attest-sbom@4651f806c01d8637787e274ac3bdf724ef169f34 # v3
        with:
          subject-name: ${{ env.PACKAGE_IMAGE }}
          subject-digest: ${{ steps.package.outputs.digest }}
          sbom-path: sbom-provider-package-linux-arm64.spdx.json
          push-to-registry: true

      - name: Verify registry SLSA and SPDX attestations
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CONTROLLER_DIGEST: ${{ steps.controller.outputs.digest }}
          ROUTER_DIGEST: ${{ steps.router.outputs.digest }}
          PACKAGE_DIGEST: ${{ steps.package.outputs.digest }}
        run: |
          set -euo pipefail
          for artifact in \
            "${CONTROLLER_IMAGE}@${CONTROLLER_DIGEST}" \
            "${ROUTER_IMAGE}@${ROUTER_DIGEST}" \
            "${PACKAGE_IMAGE}@${PACKAGE_DIGEST}"; do
            gh attestation verify "oci://${artifact}" --repo "${GITHUB_REPOSITORY}" --bundle-from-oci --cert-identity "${SIGNING_IDENTITY}" --cert-oidc-issuer "${SIGNING_ISSUER}" --source-ref "${GITHUB_REF}" --source-digest "${GITHUB_SHA}" --predicate-type "https://slsa.dev/provenance/v1" >/dev/null
            gh attestation verify "oci://${artifact}" --repo "${GITHUB_REPOSITORY}" --bundle-from-oci --cert-identity "${SIGNING_IDENTITY}" --cert-oidc-issuer "${SIGNING_ISSUER}" --source-ref "${GITHUB_REF}" --source-digest "${GITHUB_SHA}" --predicate-type "https://spdx.dev/Document" >/dev/null
          done

      - name: Require public GHCR packages and prove anonymous access
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CONTROLLER_DIGEST: ${{ steps.controller.outputs.digest }}
          ROUTER_DIGEST: ${{ steps.router.outputs.digest }}
          PACKAGE_DIGEST: ${{ steps.package.outputs.digest }}
        run: |
          set -euo pipefail
          for package in provider-runpod provider-runpod-controller provider-runpod-model-router; do
            metadata="$(gh api \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "/users/${GITHUB_REPOSITORY_OWNER}/packages/container/${package}")"
            test "$(jq -r .visibility <<<"${metadata}")" = public
            test "$(jq -r .repository.full_name <<<"${metadata}")" = "${GITHUB_REPOSITORY}"
          done

          anonymous_docker_config="$(mktemp -d)"
          trap 'rm -rf "${anonymous_docker_config}"' EXIT
          for artifact in \
            "${CONTROLLER_IMAGE}@${CONTROLLER_DIGEST}" \
            "${ROUTER_IMAGE}@${ROUTER_DIGEST}" \
            "${PACKAGE_IMAGE}@${PACKAGE_DIGEST}"; do
            DOCKER_CONFIG="${anonymous_docker_config}" docker buildx imagetools inspect "${artifact}" >/dev/null
            DOCKER_CONFIG="${anonymous_docker_config}" cosign verify --certificate-identity "${SIGNING_IDENTITY}" --certificate-oidc-issuer "${SIGNING_ISSUER}" "${artifact}" >/dev/null
            DOCKER_CONFIG="${anonymous_docker_config}" cosign verify-attestation --type slsaprovenance1 --certificate-identity "${SIGNING_IDENTITY}" --certificate-oidc-issuer "${SIGNING_ISSUER}" "${artifact}" >/dev/null
            DOCKER_CONFIG="${anonymous_docker_config}" cosign verify-attestation --type spdxjson --certificate-identity "${SIGNING_IDENTITY}" --certificate-oidc-issuer "${SIGNING_ISSUER}" "${artifact}" >/dev/null
          done
          for image in \
            "${CONTROLLER_IMAGE}@${CONTROLLER_DIGEST}" \
            "${ROUTER_IMAGE}@${ROUTER_DIGEST}" \
            "${PACKAGE_IMAGE}@${PACKAGE_DIGEST}"; do
            DOCKER_CONFIG="${anonymous_docker_config}" docker pull --platform linux/amd64 "${image}" >/dev/null
            DOCKER_CONFIG="${anonymous_docker_config}" docker pull --platform linux/arm64 "${image}" >/dev/null
          done

      - name: Publish digest manifest and GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CONTROLLER_DIGEST: ${{ steps.controller.outputs.digest }}
          ROUTER_DIGEST: ${{ steps.router.outputs.digest }}
          PACKAGE_DIGEST: ${{ steps.package.outputs.digest }}
          CONTROLLER_AMD64_DIGEST: ${{ steps.platforms.outputs.controller_amd64 }}
          CONTROLLER_ARM64_DIGEST: ${{ steps.platforms.outputs.controller_arm64 }}
          ROUTER_AMD64_DIGEST: ${{ steps.platforms.outputs.router_amd64 }}
          ROUTER_ARM64_DIGEST: ${{ steps.platforms.outputs.router_arm64 }}
        run: |
          set -euo pipefail
          cat > release-digests.txt <<EOF
          ${PACKAGE_IMAGE}@${PACKAGE_DIGEST}
          ${CONTROLLER_IMAGE}@${CONTROLLER_DIGEST}
          ${CONTROLLER_IMAGE}@${CONTROLLER_AMD64_DIGEST} linux/amd64
          ${CONTROLLER_IMAGE}@${CONTROLLER_ARM64_DIGEST} linux/arm64
          ${ROUTER_IMAGE}@${ROUTER_DIGEST}
          ${ROUTER_IMAGE}@${ROUTER_AMD64_DIGEST} linux/amd64
          ${ROUTER_IMAGE}@${ROUTER_ARM64_DIGEST} linux/arm64
          keyless-identity=${SIGNING_IDENTITY}
          issuer=${SIGNING_ISSUER}
          EOF
          sha256sum "${RELEASE_DIR}"/provider-runpod-*.xpkg sbom-*.spdx.json trivy-*.sarif cosign-verification-*.json > SHA256SUMS
          gh release create "${GITHUB_REF_NAME}" --verify-tag --generate-notes \
            "${RELEASE_DIR}"/provider-runpod-*.xpkg \
            release-digests.txt SHA256SUMS \
            sbom-*.spdx.json trivy-*.sarif cosign-verification-*.json
