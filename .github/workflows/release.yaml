          test "${local_assets}" = "${expected}"
          (cd "${release_assets}" && sha256sum --check --strict SHA256SUMS)

          release_json="$(gh api -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2026-03-10' "/repos/${GITHUB_REPOSITORY}/releases?per_page=100" | jq -ce --arg tag "${GITHUB_REF_NAME}" 'map(select(.tag_name == $tag or (.draft == true and .name == $tag))) | if length == 1 then .[0] else error("expected exactly one release for tag or named draft") end')"
          jq -e --arg tag "${GITHUB_REF_NAME}" '.name == $tag and .draft == true and (.immutable // false) == false' <<<"${release_json}" >/dev/null
          release_lookup_tag="$(jq -er '.tag_name | select(type == "string" and length > 0)' <<<"${release_json}")"
          gh release upload "${release_lookup_tag}" --clobber "${release_assets}"/*
          release_json="$(gh api -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2026-03-10' "/repos/${GITHUB_REPOSITORY}/releases?per_page=100" | jq -ce --arg tag "${GITHUB_REF_NAME}" 'map(select(.tag_name == $tag or (.draft == true and .name == $tag))) | if length == 1 then .[0] else error("expected exactly one release for tag or named draft") end')"
          actual="$(jq -r '.assets[].name' <<<"${release_json}" | LC_ALL=C sort)"
          test "${actual}" = "${expected}"
          asset_snapshot="$(asset_digest_snapshot "${release_json}")"

          downloaded_assets="$(mktemp -d)"
          release_lookup_tag="$(jq -er '.tag_name | select(type == "string" and length > 0)' <<<"${release_json}")"
          gh release download "${release_lookup_tag}" --dir "${downloaded_assets}"
          if find "${downloaded_assets}" -mindepth 1 ! -type f -print -quit | grep -q .; then
            echo 'draft release contains a non-regular asset' >&2
            exit 1
          fi
          downloaded="$(find "${downloaded_assets}" -mindepth 1 -maxdepth 1 -type f -printf '%f\n' | LC_ALL=C sort)"
          test "${downloaded}" = "${expected}"
          cmp "${release_assets}/SHA256SUMS" "${downloaded_assets}/SHA256SUMS"
          (cd "${downloaded_assets}" && sha256sum --check --strict SHA256SUMS)
          python3 - "${downloaded_assets}" "${asset_snapshot}" <<'PY'
          import hashlib, json, pathlib, stat, sys

          root = pathlib.Path(sys.argv[1])
          api_digests = {item["name"]: item["digest"] for item in json.loads(sys.argv[2])}
          files = {path.name for path in root.iterdir() if path.is_file()}
          if set(api_digests) != files:
