          expected_release_assets() {
            printf '%s\n' \
              "provider-runpod-${GITHUB_REF_NAME}-linux-amd64.xpkg" \
              "provider-runpod-${GITHUB_REF_NAME}-linux-arm64.xpkg" \
              BUILD-SHA256SUMS SHA256SUMS release-digests.txt
