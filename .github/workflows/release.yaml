          EXPECTED_CONTROLLER_DIGEST: ${{ steps.images.outputs.controller_digest }}
          EXPECTED_ROUTER_DIGEST: ${{ steps.images.outputs.router_digest }}
        run: |
          set -euo pipefail
          canonical_release_body() {
            printf '<!-- provider-runpod automated release -->\n\nAutomated immutable release %s for commit %s.\n\nWorkflow run: %s/%s/actions/runs/%s' \
