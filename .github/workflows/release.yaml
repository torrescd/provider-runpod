          validate_release_digests() {
            python3 - "$1" <<'PY'
          import os, pathlib, re, sys

          path = pathlib.Path(sys.argv[1])
          try:
              text = path.read_bytes().decode("utf-8")
          except UnicodeDecodeError as error:
              raise SystemExit("release-digests.txt is not valid UTF-8") from error
          if "\r" in text or "\0" in text or not text.endswith("\n"):
              raise SystemExit("release-digests.txt has invalid line encoding")
          lines = text[:-1].split("\n")
          keys = [
              "release-tag",
              "release-ref",
              "source-commit",
              "handoff-artifact-id",
              "handoff-digest",
              "package-ref",
              "controller-ref",
              "model-router-ref",
              "signing-identity",
              "signing-issuer",
          ]
          if len(lines) != len(keys):
              raise SystemExit("release-digests.txt has missing or extra lines")
          values = {}
          for expected_key, line in zip(keys, lines, strict=True):
              key, separator, value = line.partition("=")
              if separator != "=" or key != expected_key or not value or key in values:
                  raise SystemExit(f"invalid release-digests.txt line: {line!r}")
              values[key] = value

          expected = {
              "release-tag": os.environ["GITHUB_REF_NAME"],
              "release-ref": os.environ["GITHUB_REF"],
              "source-commit": os.environ["GITHUB_SHA"],
              "signing-identity": os.environ["SIGNING_IDENTITY"],
              "signing-issuer": os.environ["SIGNING_ISSUER"],
          }
          for key, value in expected.items():
              if values[key] != value:
                  raise SystemExit(f"release evidence mismatch for {key}")
          if not re.fullmatch(r"[1-9][0-9]*", values["handoff-artifact-id"]):
              raise SystemExit("invalid handoff artifact ID in release evidence")
          if not re.fullmatch(r"sha256:[0-9a-f]{64}", values["handoff-digest"]):
              raise SystemExit("invalid handoff digest in release evidence")
          images = {
              "package-ref": os.environ["PACKAGE_IMAGE"],
              "controller-ref": os.environ["CONTROLLER_IMAGE"],
              "model-router-ref": os.environ["ROUTER_IMAGE"],
          }
          for key, image in images.items():
              if re.fullmatch(re.escape(image) + r"@sha256:[0-9a-f]{64}", values[key]) is None:
                  raise SystemExit(f"invalid final image reference for {key}")

          optional_values = [
              os.environ.get("EXPECTED_HANDOFF_ARTIFACT_ID", ""),
              os.environ.get("EXPECTED_HANDOFF_DIGEST", ""),
              os.environ.get("EXPECTED_PACKAGE_DIGEST", ""),
              os.environ.get("EXPECTED_CONTROLLER_DIGEST", ""),
              os.environ.get("EXPECTED_ROUTER_DIGEST", ""),
          ]
          if any(optional_values) != all(optional_values):
              raise SystemExit("incomplete local release evidence expectations")
          if all(optional_values):
              handoff_id, handoff_digest, package_digest, controller_digest, router_digest = optional_values
              exact_local = {
                  "handoff-artifact-id": handoff_id,
                  "handoff-digest": handoff_digest,
                  "package-ref": f'{images["package-ref"]}@{package_digest}',
                  "controller-ref": f'{images["controller-ref"]}@{controller_digest}',
                  "model-router-ref": f'{images["model-router-ref"]}@{router_digest}',
              }
              for key, value in exact_local.items():
                  if values[key] != value:
                      raise SystemExit(f"local release evidence mismatch for {key}")
          PY
          }
          expected="$(expected_release_assets | LC_ALL=C sort)"
          actual_assets="$(jq -r '.assets[].name' <<<"${published}" | LC_ALL=C sort)"
          test "${actual_assets}" = "${expected}"
          asset_snapshot="$(asset_digest_snapshot "${published}")"
          object="$(gh api -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' "/repos/${GITHUB_REPOSITORY}/git/ref/tags/${GITHUB_REF_NAME}")"
          type="$(jq -r .object.type <<<"${object}")"
          sha="$(jq -r .object.sha <<<"${object}")"
          depth=0
          while test "${type}" = tag; do
            depth=$((depth + 1)); test "${depth}" -le 5
            object="$(gh api -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' "/repos/${GITHUB_REPOSITORY}/git/tags/${sha}")"
            type="$(jq -r .object.type <<<"${object}")"
            sha="$(jq -r .object.sha <<<"${object}")"
          done
          test "${type}" = commit
          test "${sha}" = "${GITHUB_SHA}"
          release_dir="$(mktemp -d)"
          gh release download "${GITHUB_REF_NAME}" --dir "${release_dir}"
          if find "${release_dir}" -mindepth 1 ! -type f -print -quit | grep -q .; then
            echo 'published release contains a non-regular asset' >&2
            exit 1
          fi
          downloaded="$(find "${release_dir}" -mindepth 1 -maxdepth 1 -type f -printf '%f\n' | LC_ALL=C sort)"
          test "${downloaded}" = "${expected}"
          python3 - "${release_dir}" "${asset_snapshot}" <<'PY'
          import hashlib, json, pathlib, re, stat, sys

          root = pathlib.Path(sys.argv[1])
          files = {path.name for path in root.iterdir() if path.is_file()}
          api_digests = {item["name"]: item["digest"] for item in json.loads(sys.argv[2])}
          if set(api_digests) != files:
              raise SystemExit("GitHub asset digest set does not match downloaded assets")
          actual_digests = {}
          for name in files:
              path = root / name
              mode = path.lstat().st_mode
              if not stat.S_ISREG(mode):
                  raise SystemExit(f"release asset is not a regular file: {name!r}")
              hasher = hashlib.sha256()
              with path.open("rb") as stream:
                  for chunk in iter(lambda: stream.read(1024 * 1024), b""):
                      hasher.update(chunk)
              actual_digests[name] = hasher.hexdigest()
              if api_digests[name] != f"sha256:{actual_digests[name]}":
                  raise SystemExit(f"GitHub asset digest mismatch: {name!r}")
          expected = files - {"SHA256SUMS"}
          checksums = {}
          for line in (root / "SHA256SUMS").read_text(encoding="utf-8").splitlines():
              match = re.fullmatch(r"([0-9a-f]{64})  ([A-Za-z0-9][A-Za-z0-9._-]*)", line)
              if match is None:
                  raise SystemExit(f"invalid SHA256SUMS line: {line!r}")
              digest, name = match.groups()
              if name == "SHA256SUMS" or name in checksums:
                  raise SystemExit(f"invalid or duplicate checksum name: {name!r}")
              checksums[name] = digest
          if set(checksums) != expected:
              raise SystemExit("SHA256SUMS does not bind the exact immutable asset set")
          for name, expected_digest in checksums.items():
              if actual_digests[name] != expected_digest:
                  raise SystemExit(f"release asset digest mismatch: {name!r}")
          PY
          (cd "${release_dir}" && sha256sum --check --strict SHA256SUMS)
          validate_release_digests "${release_dir}/release-digests.txt"
          anonymous_docker_config="$(mktemp -d)"
          mapfile -t evidence_lines < "${release_dir}/release-digests.txt"
          for artifact in \
            "${evidence_lines[5]#package-ref=}" \
            "${evidence_lines[6]#controller-ref=}" \
            "${evidence_lines[7]#model-router-ref=}"; do
            image="${artifact%@*}"
            digest="${artifact#*@}"
            for tag in "${GITHUB_REF_NAME}" "sha-${GITHUB_SHA}"; do
              actual="$(DOCKER_CONFIG="${anonymous_docker_config}" docker buildx imagetools inspect "${image}:${tag}" --format '{{json .Manifest.Digest}}' | tr -d '"')"
              test "${actual}" = "${digest}"
            done
          done
