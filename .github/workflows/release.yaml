            test "${actual}" = "${digest}"
          }
          registry_tag_digest() {
            local image="$1" tag="$2" actual
            if actual="$(docker buildx imagetools inspect "${image}:${tag}" --format '{{json .Manifest.Digest}}' 2>/dev/null | tr -d '"')"; then
