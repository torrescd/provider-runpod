          published="$(gh api -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2026-03-10' "/repos/${GITHUB_REPOSITORY}/releases?per_page=100" | jq -ce --arg tag "${GITHUB_REF_NAME}" 'map(select(.tag_name == $tag)) | if length == 1 then .[0] else error("expected exactly one release for tag") end')"
