          import hashlib, json, pathlib, stat, sys

          root = pathlib.Path(sys.argv[1])
          api_digests = {item["name"]: item["digest"] for item in json.loads(sys.argv[2])}
          files = {path.name for path in root.iterdir() if path.is_file()}
