          ensure_tag() {
            local image="$1" package="$2" digest="$3" tag="$4"
            local existing actual
            existing="$(tagged_digest "${package}" "${tag}")"
            if [[ "${existing}" =~ ^[0-9a-f]{64}$ ]]; then
