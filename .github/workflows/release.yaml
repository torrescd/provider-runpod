              done
            done
          }
          asset_digest_snapshot() {
            jq -ce '
              [.assets[] | {name, digest}] | sort_by(.name) |
              if all(.[];
                ((.name | type) == "string") and
                ((.digest | type) == "string") and
                (.digest | test("^sha256:[0-9a-f]{64}$"))
              ) then . else error("release assets are missing GitHub SHA-256 digests") end
            ' <<<"$1"
          }
          expected="$(expected_release_assets | LC_ALL=C sort)"
          release_assets="release-assets"
          mkdir "${release_assets}"
          for source_asset in "${source_assets[@]}"; do
            asset_name="${source_asset##*/}"
            test ! -e "${release_assets}/${asset_name}"
            cp -- "${source_asset}" "${release_assets}/${asset_name}"
          done
          mapfile -t checksum_names < <(expected_release_assets | grep -Fvx SHA256SUMS | LC_ALL=C sort)
          : > "${release_assets}/SHA256SUMS"
