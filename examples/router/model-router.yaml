apiVersion: v1
kind: ServiceAccount
metadata:
  name: provider-runpod-model-router
  namespace: runpod-system
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: provider-runpod-model-router
  namespace: runpod-system
rules:
  - apiGroups: ["verification.runpod.crossplane.io"]
    resources: ["endpointchecks"]
    verbs: ["get", "list", "watch", "update", "delete"]
  - apiGroups: ["verification.runpod.crossplane.io"]
    resources: ["endpointchecks/status"]
    verbs: ["update"]
  - apiGroups: ["serverless.runpod.crossplane.io"]
    resources: ["endpoints"]
    resourceNames: ["opencode-model"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["runpod-inference"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: provider-runpod-model-router
  namespace: runpod-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: provider-runpod-model-router
subjects:
  - kind: ServiceAccount
    name: provider-runpod-model-router
    namespace: runpod-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: provider-runpod-model-router
  namespace: runpod-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: provider-runpod-model-router
  template:
    metadata:
      labels:
        app.kubernetes.io/name: provider-runpod-model-router
    spec:
      serviceAccountName: provider-runpod-model-router
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: model-router
          # Replace the tag with the release digest from release-digests.txt.
          image: ghcr.io/torrescd/provider-runpod-model-router:v0.1.0
          args: ["--namespace=runpod-system", "--listen=:8080"]
          env:
            - name: POD_NAMESPACE
              value: runpod-system
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              # Kubernetes process readiness must not depend on an experiment
              # route that is created by a later GitOps stage. Clients use
              # /readyz for fail-closed model-route readiness.
              path: /healthz
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: provider-runpod-model-router
  namespace: runpod-system
spec:
  selector:
    app.kubernetes.io/name: provider-runpod-model-router
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: provider-runpod-model-router-default-deny-egress
  namespace: runpod-system
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: provider-runpod-model-router
  policyTypes: ["Egress"]
  egress: []
