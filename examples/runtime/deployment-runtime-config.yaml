apiVersion: pkg.crossplane.io/v1beta1
kind: DeploymentRuntimeConfig
metadata:
  name: provider-runpod-hardened
spec:
  serviceAccountTemplate:
    metadata:
      name: provider-runpod
  deploymentTemplate:
    metadata:
      labels:
        app.kubernetes.io/name: provider-runpod
    spec:
      replicas: 1
      selector: {}
      template:
        metadata:
          labels:
            app.kubernetes.io/name: provider-runpod
        spec:
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: package-runtime
              args:
                - --enable-secret-cache=false
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              resources:
                requests:
                  cpu: 50m
                  memory: 96Mi
                limits:
                  cpu: 500m
                  memory: 256Mi
