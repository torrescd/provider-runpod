apiVersion: pkg.crossplane.io/v1beta1
kind: DeploymentRuntimeConfig
metadata:
  name: provider-runpod-hardened
spec:
  deploymentTemplate:
    metadata:
      labels:
        app.kubernetes.io/name: provider-runpod
    spec:
      replicas: 1
      selector: {}
      template:
        metadata:
          labels:
            app.kubernetes.io/name: provider-runpod
        spec:
          # This ServiceAccount is owned by GitOps and created by examples/rbac/.
          # Do not add serviceAccountTemplate when Crossplane's RBAC manager is
          # disabled; that would make package-manager ownership ambiguous.
          serviceAccountName: provider-runpod
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: package-runtime
              args:
                - --no-enable-secret-cache
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              resources:
                requests:
                  cpu: 50m
                  memory: 96Mi
                limits:
                  cpu: 500m
                  memory: 256Mi
