apiVersion: serverless.runpod.crossplane.io/v1alpha1
kind: Endpoint
metadata:
  name: opencode-model
  namespace: runpod-system
spec:
  providerConfigRef:
    kind: ClusterProviderConfig
    name: restricted-management
  forProvider:
    maxLifetimeSeconds: 14400
    deleteReferencedTemplateOnExpiry: true
    name: xp-opencode-experiment
    templateIdRef:
      name: opencode-model
    gpuTypeIds:
      - NVIDIA L4
    dataCenterIds:
      - EU-RO-1
    # Secured routing requires one continuously provisioned worker so an
    # ordinary request can never race management proof for a cold placement.
    workersMin: 1
    workersMax: 1
    # Local controller ceiling: USD 2.000 per active worker-hour.
    maxWorkerCostMilliUsdPerHour: 2000
    idleTimeout: 5
    scalerType: QUEUE_DELAY
    scalerValue: 4
    executionTimeoutMs: 600000
