---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.0
  name: endpoints.serverless.runpod.crossplane.io
spec:
  group: serverless.runpod.crossplane.io
  names:
    categories:
    - crossplane
    - managed
    - runpod
    kind: Endpoint
    listKind: EndpointList
    plural: endpoints
    singular: endpoint
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.conditions[?(@.type=='Ready')].status
      name: READY
      type: string
    - jsonPath: .status.conditions[?(@.type=='Synced')].status
      name: SYNCED
      type: string
    - jsonPath: .metadata.annotations.crossplane\.io/external-name
      name: EXTERNAL-NAME
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: AGE
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Endpoint is a bounded RunPod Serverless endpoint with exactly
          one worker.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              EndpointSpec requires the full Crossplane lifecycle. The TTL janitor can
              only guarantee external cleanup when Delete cannot be disabled through an
              observe-only management policy.
            properties:
              forProvider:
                description: |-
                  EndpointParameters are the bounded RunPod Serverless endpoint fields.
                  API source: https://docs.runpod.io/api-reference/endpoints/POST/endpoints
                properties:
                  allowedCudaVersions:
                    description: AllowedCUDAVersions limits workers to compatible
                      CUDA versions.
                    items:
                      type: string
                    maxItems: 8
                    type: array
                  dataCenterIds:
                    description: DataCenterIDs limits placement to approved data centers.
                    items:
                      maxLength: 63
                      type: string
                    maxItems: 16
                    minItems: 1
                    type: array
                  deleteReferencedTemplateOnExpiry:
                    default: true
                    description: |-
                      DeleteReferencedTemplateOnExpiry deletes the referenced Kubernetes
                      Template CR after route withdrawal when the endpoint expires. It has no
                      effect when no reference is configured (which admission rejects).
                    type: boolean
                  executionTimeoutMs:
                    description: ExecutionTimeoutMS bounds an inference request.
                    format: int32
                    maximum: 600000
                    minimum: 1000
                    type: integer
                  gpuTypeIds:
                    description: GPUTypeIDs is an explicit, operator-approved GPU
                      type allowlist.
                    items:
                      type: string
                    maxItems: 8
                    minItems: 1
                    type: array
                  idleTimeout:
                    description: IdleTimeout is the number of seconds before an idle
                      worker is released.
                    format: int32
                    maximum: 3600
                    minimum: 1
                    type: integer
                  maxLifetimeSeconds:
                    description: |-
                      MaxLifetimeSeconds is the hard lifetime of this experiment endpoint.
                      The provider janitor removes EndpointChecks first, then deletes this CR.
                    format: int32
                    maximum: 86400
                    minimum: 60
                    type: integer
                    x-kubernetes-validations:
                    - message: maxLifetimeSeconds is immutable
                      rule: self == oldSelf
                  maxWorkerCostMilliUsdPerHour:
                    description: |-
                      MaxWorkerCostMilliUSDPerHour is a local fail-closed ceiling applied to
                      every active worker's official cost fields. It is not sent to RunPod.
                    format: int32
                    maximum: 10000
                    minimum: 1
                    type: integer
                  name:
                    description: Name is the endpoint's human-readable name.
                    maxLength: 191
                    minLength: 1
                    pattern: ^[A-Za-z0-9][A-Za-z0-9._-]*$
                    type: string
                  scalerType:
                    description: ScalerType controls RunPod autoscaling.
                    enum:
                    - QUEUE_DELAY
                    - REQUEST_COUNT
                    type: string
                  scalerValue:
                    description: ScalerValue is the autoscaling target.
                    format: int32
                    maximum: 100
                    minimum: 1
                    type: integer
                  templateIdRef:
                    description: TemplateIDRef references a Template in this namespace.
                    properties:
                      name:
                        description: Name of the referenced object.
                        type: string
                      policy:
                        description: Policies for referencing.
                        properties:
                          resolution:
                            default: Required
                            description: |-
                              Resolution specifies whether resolution of this reference is required.
                              The default is 'Required', which means the reconcile will fail if the
                              reference cannot be resolved. 'Optional' means this reference will be
                              a no-op if it cannot be resolved.
                            enum:
                            - Required
                            - Optional
                            type: string
                          resolve:
                            description: |-
                              Resolve specifies when this reference should be resolved. The default
                              is 'IfNotPresent', which will attempt to resolve the reference only when
                              the corresponding field is not present. Use 'Always' to resolve the
                              reference on every reconcile.
                            enum:
                            - Always
                            - IfNotPresent
                            type: string
                        type: object
                    required:
                    - name
                    type: object
                  workersMax:
                    description: WorkersMax is exactly one for experiment cost control.
                    format: int32
                    maximum: 1
                    minimum: 1
                    type: integer
                  workersMin:
                    description: |-
                      WorkersMin is exactly one. The secured route cannot safely admit the
                      first ordinary request to a newly placed scale-to-zero worker before the
                      management API has exposed its cost, storage, and Secure Cloud fields.
                    format: int32
                    maximum: 1
                    minimum: 1
                    type: integer
                required:
                - dataCenterIds
                - executionTimeoutMs
                - gpuTypeIds
                - idleTimeout
                - maxLifetimeSeconds
                - maxWorkerCostMilliUsdPerHour
                - name
                - scalerType
                - scalerValue
                - workersMax
                - workersMin
                type: object
                x-kubernetes-validations:
                - message: templateIdRef is required
                  rule: has(self.templateIdRef)
                - message: dataCenterIds must be explicit RunPod identifiers
                  rule: self.dataCenterIds.all(id, id.matches('^[A-Za-z0-9_-]+$'))
              managementPolicies:
                default:
                - '*'
                description: |-
                  THIS IS A BETA FIELD. It is on by default but can be opted out
                  through a Crossplane feature flag.
                  ManagementPolicies specify the array of actions Crossplane is allowed to
                  take on the managed and external resources.
                  See the design doc for more information: https://github.com/crossplane/crossplane/blob/499895a25d1a1a0ba1604944ef98ac7a1a71f197/design/design-doc-observe-only-resources.md?plain=1#L223
                  and this one: https://github.com/crossplane/crossplane/blob/444267e84783136daa93568b364a5f01228cacbe/design/one-pager-ignore-changes.md
                items:
                  description: |-
                    A ManagementAction represents an action that the Crossplane controllers
                    can take on an external resource.
                  enum:
                  - Observe
                  - Create
                  - Update
                  - Delete
                  - LateInitialize
                  - '*'
                  type: string
                type: array
              providerConfigRef:
                default:
                  kind: ClusterProviderConfig
                  name: default
                description: |-
                  ProviderConfigReference specifies how the provider that will be used to
                  create, observe, update, and delete this managed resource should be
                  configured.
                properties:
                  kind:
                    description: Kind of the referenced object.
                    type: string
                  name:
                    description: Name of the referenced object.
                    type: string
                required:
                - kind
                - name
                type: object
              writeConnectionSecretToRef:
                description: |-
                  WriteConnectionSecretToReference specifies the namespace and name of a
                  Secret to which any connection details for this managed resource should
                  be written. Connection details frequently include the endpoint, username,
                  and password required to connect to the managed resource.
                properties:
                  name:
                    description: Name of the secret.
                    type: string
                required:
                - name
                type: object
            required:
            - forProvider
            type: object
            x-kubernetes-validations:
            - message: bounded Endpoints require managementPolicies exactly ['*']
              rule: self.managementPolicies == ['*']
          status:
            properties:
              atProvider:
                properties:
                  flashBootDisabled:
                    description: |-
                      FlashBootDisabled records a successful provider write of flashboot=false.
                      RunPod's v1 GET response does not publish this field, so the proof is
                      retained only while the external ID and rollout Version remain unchanged.
                    type: boolean
                  flashBootEvidenceVersion:
                    format: int32
                    type: integer
                  flashBootLastEnforcedAt:
                    format: date-time
                    type: string
                  id:
                    type: string
                  inferenceUrl:
                    type: string
                  lastObservedAt:
                    format: date-time
                    type: string
                  templateId:
                    type: string
                  templateImageDigest:
                    type: string
                  templateResourceGeneration:
                    format: int64
                    type: integer
                  templateResourceUid:
                    description: |-
                      TemplateResourceUID, TemplateResourceGeneration, and TemplateImageDigest
                      bind endpoint readiness to the exact managed Template revision whose
                      rollout was observed. Consumers direct-read that Template before routing.
                    type: string
                  version:
                    description: |-
                      Version is RunPod's rollout revision. EndpointCheck binds every full
                      model/tool verification to this value before model-router admits a route.
                    format: int32
                    type: integer
                  workerSecurityObservedAt:
                    format: date-time
                    type: string
                  workerSecurityProofVersion:
                    format: int32
                    type: integer
                  workerSecurityValidated:
                    description: |-
                      WorkerSecurityValidated records that at least one active worker was
                      directly observed with the bounded image, storage, cost, placement, and
                      Secure Cloud evidence for WorkerSecurityProofVersion. Any subsequent
                      management observation with zero workers clears the proof, so every cold
                      start must complete a new wake -> management-observe handshake before the
                      router can admit traffic.
                    type: boolean
                  workersMax:
                    format: int32
                    type: integer
                  workersMin:
                    format: int32
                    type: integer
                type: object
              conditions:
                description: Conditions of the resource.
                items:
                  description: A Condition that may apply to a resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        LastTransitionTime is the last time this condition transitioned from one
                        status to another.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        A Message containing details about this condition's last transition from
                        one status to another, if any.
                      type: string
                    observedGeneration:
                      description: |-
                        ObservedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      type: integer
                    reason:
                      description: A Reason for this condition's last transition from
                        one status to another.
                      type: string
                    status:
                      description: Status of this condition; is it currently True,
                        False, or Unknown?
                      type: string
                    type:
                      description: |-
                        Type of this condition. At most one of each condition type may apply to
                        a resource at any point in time.
                      type: string
                  required:
                  - lastTransitionTime
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              lastHandledReconcileAt:
                description: |-
                  LastHandledReconcileAt holds the value of the most recent
                  reconcile-requested-at annotation token that the controller has
                  processed. Users can compare this to the annotation to determine
                  whether a reconcile request has been handled.
                type: string
              observedGeneration:
                description: |-
                  ObservedGeneration is the latest metadata.generation
                  which resulted in either a ready state, or stalled due to error
                  it can not recover from without human intervention.
                format: int64
                type: integer
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
