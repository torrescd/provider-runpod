---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.0
  name: templates.serverless.runpod.crossplane.io
spec:
  group: serverless.runpod.crossplane.io
  names:
    categories:
    - crossplane
    - managed
    - runpod
    kind: Template
    listKind: TemplateList
    plural: templates
    singular: template
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.conditions[?(@.type=='Ready')].status
      name: READY
      type: string
    - jsonPath: .status.conditions[?(@.type=='Synced')].status
      name: SYNCED
      type: string
    - jsonPath: .metadata.annotations.crossplane\.io/external-name
      name: EXTERNAL-NAME
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: AGE
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Template is a private RunPod Serverless template backed by a
          digest-pinned image.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              TemplateSpec requires the full Crossplane lifecycle. A bounded Template may
              not be orphaned when its Kubernetes object is removed by GitOps or the
              Endpoint lifetime reaper.
            properties:
              forProvider:
                description: |-
                  TemplateParameters are the supported, security-bounded RunPod template fields.
                  API source: https://docs.runpod.io/api-reference/templates/POST/templates
                properties:
                  containerDiskInGb:
                    default: 50
                    description: ContainerDiskInGB is ephemeral container disk capacity.
                    format: int32
                    maximum: 100
                    minimum: 1
                    type: integer
                  dockerEntrypoint:
                    description: DockerEntrypoint overrides the image entrypoint.
                    items:
                      type: string
                    maxItems: 32
                    type: array
                  dockerStartCmd:
                    description: DockerStartCmd overrides the image command.
                    items:
                      type: string
                    maxItems: 64
                    type: array
                  imageName:
                    description: |-
                      ImageName is an OCI image reference pinned to a sha256 digest.
                      Mutable tags are deliberately rejected.
                    pattern: ^[^[:space:]@]+@sha256:[a-f0-9]{64}$
                    type: string
                  maxLifetimeSeconds:
                    description: |-
                      MaxLifetimeSeconds bounds this Template even when the dependent Endpoint
                      is never admitted or created. The independent reaper direct-lists all
                      Endpoint references before initiating deletion.
                    format: int32
                    maximum: 86400
                    minimum: 60
                    type: integer
                    x-kubernetes-validations:
                    - message: maxLifetimeSeconds is immutable
                      rule: self == oldSelf
                  name:
                    description: Name is the unique human-readable template name.
                    maxLength: 191
                    minLength: 1
                    pattern: ^[A-Za-z0-9][A-Za-z0-9._-]*$
                    type: string
                  ports:
                    description: |-
                      Ports contains RunPod port declarations such as 8000/http.
                      It is required because RunPod otherwise defaults to 8888/http and 22/tcp.
                    items:
                      maxLength: 10
                      pattern: ^([1-9][0-9]{0,3}|[1-5][0-9]{4}|6[0-4][0-9]{3}|65[0-4][0-9]{2}|655[0-2][0-9]|6553[0-5])/(http|tcp)$
                      type: string
                    maxItems: 16
                    minItems: 1
                    type: array
                  volumeInGb:
                    description: |-
                      VolumeInGB must be explicitly zero. RunPod otherwise defaults an omitted
                      volume to 20 GiB and a /workspace mount; this bounded provider does not
                      support persistent worker volumes.
                    enum:
                    - 0
                    format: int32
                    type: integer
                required:
                - imageName
                - maxLifetimeSeconds
                - name
                - ports
                - volumeInGb
                type: object
              managementPolicies:
                default:
                - '*'
                description: |-
                  THIS IS A BETA FIELD. It is on by default but can be opted out
                  through a Crossplane feature flag.
                  ManagementPolicies specify the array of actions Crossplane is allowed to
                  take on the managed and external resources.
                  See the design doc for more information: https://github.com/crossplane/crossplane/blob/499895a25d1a1a0ba1604944ef98ac7a1a71f197/design/design-doc-observe-only-resources.md?plain=1#L223
                  and this one: https://github.com/crossplane/crossplane/blob/444267e84783136daa93568b364a5f01228cacbe/design/one-pager-ignore-changes.md
                items:
                  description: |-
                    A ManagementAction represents an action that the Crossplane controllers
                    can take on an external resource.
                  enum:
                  - Observe
                  - Create
                  - Update
                  - Delete
                  - LateInitialize
                  - '*'
                  type: string
                type: array
              providerConfigRef:
                default:
                  kind: ClusterProviderConfig
                  name: default
                description: |-
                  ProviderConfigReference specifies how the provider that will be used to
                  create, observe, update, and delete this managed resource should be
                  configured.
                properties:
                  kind:
                    description: Kind of the referenced object.
                    type: string
                  name:
                    description: Name of the referenced object.
                    type: string
                required:
                - kind
                - name
                type: object
              writeConnectionSecretToRef:
                description: |-
                  WriteConnectionSecretToReference specifies the namespace and name of a
                  Secret to which any connection details for this managed resource should
                  be written. Connection details frequently include the endpoint, username,
                  and password required to connect to the managed resource.
                properties:
                  name:
                    description: Name of the secret.
                    type: string
                required:
                - name
                type: object
            required:
            - forProvider
            type: object
            x-kubernetes-validations:
            - message: bounded Templates require managementPolicies exactly ['*']
              rule: self.managementPolicies == ['*']
          status:
            properties:
              atProvider:
                properties:
                  id:
                    type: string
                  imageName:
                    type: string
                  isServerless:
                    type: boolean
                  lastObservedAt:
                    format: date-time
                    type: string
                  name:
                    type: string
                type: object
              conditions:
                description: Conditions of the resource.
                items:
                  description: A Condition that may apply to a resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        LastTransitionTime is the last time this condition transitioned from one
                        status to another.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        A Message containing details about this condition's last transition from
                        one status to another, if any.
                      type: string
                    observedGeneration:
                      description: |-
                        ObservedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      type: integer
                    reason:
                      description: A Reason for this condition's last transition from
                        one status to another.
                      type: string
                    status:
                      description: Status of this condition; is it currently True,
                        False, or Unknown?
                      type: string
                    type:
                      description: |-
                        Type of this condition. At most one of each condition type may apply to
                        a resource at any point in time.
                      type: string
                  required:
                  - lastTransitionTime
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              lastHandledReconcileAt:
                description: |-
                  LastHandledReconcileAt holds the value of the most recent
                  reconcile-requested-at annotation token that the controller has
                  processed. Users can compare this to the annotation to determine
                  whether a reconcile request has been handled.
                type: string
              observedGeneration:
                description: |-
                  ObservedGeneration is the latest metadata.generation
                  which resulted in either a ready state, or stalled due to error
                  it can not recover from without human intervention.
                format: int64
                type: integer
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
