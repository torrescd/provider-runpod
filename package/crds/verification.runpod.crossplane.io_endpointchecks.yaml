---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.0
  name: endpointchecks.verification.runpod.crossplane.io
spec:
  group: verification.runpod.crossplane.io
  names:
    categories:
    - crossplane
    - runpod
    kind: EndpointCheck
    listKind: EndpointCheckList
    plural: endpointchecks
    singular: endpointcheck
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.conditions[?(@.type=='Ready')].status
      name: READY
      type: string
    - jsonPath: .spec.forProvider.endpointIdRef.name
      name: ENDPOINT
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: AGE
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          EndpointCheck gates model routing on authenticated health, model identity,
          and deterministic tool-call checks. It never consumes a management API key.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            properties:
              forProvider:
                description: EndpointCheckParameters define an authenticated, inference-only
                  readiness gate.
                properties:
                  endpointIdRef:
                    description: EndpointIDRef references an Endpoint in this namespace.
                    properties:
                      name:
                        description: Name of the referenced object.
                        type: string
                      policy:
                        description: Policies for referencing.
                        properties:
                          resolution:
                            default: Required
                            description: |-
                              Resolution specifies whether resolution of this reference is required.
                              The default is 'Required', which means the reconcile will fail if the
                              reference cannot be resolved. 'Optional' means this reference will be
                              a no-op if it cannot be resolved.
                            enum:
                            - Required
                            - Optional
                            type: string
                          resolve:
                            description: |-
                              Resolve specifies when this reference should be resolved. The default
                              is 'IfNotPresent', which will attempt to resolve the reference only when
                              the corresponding field is not present. Use 'Always' to resolve the
                              reference on every reconcile.
                            enum:
                            - Always
                            - IfNotPresent
                            type: string
                        type: object
                    required:
                    - name
                    type: object
                  expectedModelId:
                    description: ExpectedModelID is required to appear exactly in
                      the OpenAI models response.
                    maxLength: 512
                    minLength: 1
                    type: string
                  inferenceCredentialsSecretRef:
                    description: |-
                      InferenceCredentialsSecretRef contains an endpoint-scoped token. The
                      referenced Secret must be labelled
                      runpod.crossplane.io/credential-purpose=inference.
                    properties:
                      key:
                        type: string
                      name:
                        description: Name of the secret.
                        type: string
                    required:
                    - key
                    - name
                    type: object
                  maxLifetimeSeconds:
                    description: |-
                      MaxLifetimeSeconds is the hard lifetime of the admitted route. The check
                      controller self-deletes the CR at expiry, causing model-router to fail closed.
                    format: int32
                    maximum: 86400
                    minimum: 60
                    type: integer
                    x-kubernetes-validations:
                    - message: maxLifetimeSeconds is immutable
                      rule: self == oldSelf
                  timeoutSeconds:
                    default: 180
                    description: |-
                      TimeoutSeconds bounds each individual full-verification request. The
                      default tolerates initial worker provisioning and model loading.
                    format: int32
                    maximum: 600
                    minimum: 1
                    type: integer
                  verificationIntervalSeconds:
                    default: 3600
                    description: |-
                      VerificationIntervalSeconds is the minimum interval between authenticated
                      model/tool-call verifications in steady state. Kubernetes Endpoint status
                      and credential metadata are checked every 30 seconds without invoking GPU
                      inference. Relevant generation, endpoint, or credential changes bypass the
                      interval and require immediate full re-verification.
                    format: int32
                    maximum: 86400
                    minimum: 900
                    type: integer
                required:
                - expectedModelId
                - inferenceCredentialsSecretRef
                - maxLifetimeSeconds
                type: object
                x-kubernetes-validations:
                - message: endpointIdRef is required
                  rule: has(self.endpointIdRef)
            required:
            - forProvider
            type: object
          status:
            properties:
              atProvider:
                properties:
                  credentialsSecretResourceVersion:
                    description: |-
                      CredentialsSecretResourceVersion binds admission to the exact Secret
                      version used by the authenticated checks. It is metadata, never secret
                      material. A credential rotation withdraws routing until it is reverified.
                    type: string
                  endpointId:
                    type: string
                  endpointResourceGeneration:
                    format: int64
                    type: integer
                  endpointResourceUid:
                    description: |-
                      EndpointResourceUID and EndpointResourceGeneration bind a verification to
                      the exact referenced Kubernetes Endpoint identity and desired revision.
                      EndpointVersion binds it to RunPod's observed rollout revision.
                    type: string
                  endpointVersion:
                    format: int32
                    type: integer
                  healthy:
                    type: boolean
                  inferenceUrl:
                    type: string
                  lastCheckedAt:
                    description: |-
                      LastCheckedAt records the latest cheap control-plane/credential liveness
                      check. LastVerificationAttemptAt records every attempted authenticated
                      health/model/tool verification, including failures and timeouts, so the
                      minimum verification interval also bounds costly retry attempts.
                      LastVerifiedAt records the latest successful full verification.
                    format: date-time
                    type: string
                  lastVerificationAttemptAt:
                    format: date-time
                    type: string
                  lastVerifiedAt:
                    format: date-time
                    type: string
                  modelVerified:
                    type: boolean
                  templateImageDigest:
                    type: string
                  templateResourceGeneration:
                    format: int64
                    type: integer
                  templateResourceUid:
                    type: string
                  toolCallVerified:
                    type: boolean
                type: object
              conditions:
                description: Conditions of the resource.
                items:
                  description: A Condition that may apply to a resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        LastTransitionTime is the last time this condition transitioned from one
                        status to another.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        A Message containing details about this condition's last transition from
                        one status to another, if any.
                      type: string
                    observedGeneration:
                      description: |-
                        ObservedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      type: integer
                    reason:
                      description: A Reason for this condition's last transition from
                        one status to another.
                      type: string
                    status:
                      description: Status of this condition; is it currently True,
                        False, or Unknown?
                      type: string
                    type:
                      description: |-
                        Type of this condition. At most one of each condition type may apply to
                        a resource at any point in time.
                      type: string
                  required:
                  - lastTransitionTime
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              observedGeneration:
                description: |-
                  ObservedGeneration is the EndpointCheck generation evaluated by the
                  verifier. It is explicit because this auxiliary gate is not a Crossplane
                  managed resource and has no providerConfig or management policies.
                format: int64
                type: integer
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
