---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.0
  name: endpointchecks.verification.runpod.crossplane.io
spec:
  group: verification.runpod.crossplane.io
  names:
    categories:
    - crossplane
    - managed
    - runpod
    kind: EndpointCheck
    listKind: EndpointCheckList
    plural: endpointchecks
    singular: endpointcheck
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.conditions[?(@.type=='Ready')].status
      name: READY
      type: string
    - jsonPath: .spec.forProvider.endpointId
      name: ENDPOINT
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: AGE
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          EndpointCheck gates model routing on authenticated health, model identity,
          and deterministic tool-call checks. It never consumes a management API key.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            properties:
              forProvider:
                description: EndpointCheckParameters define an authenticated, inference-only
                  readiness gate.
                properties:
                  endpointId:
                    description: EndpointID is the external RunPod endpoint ID. Prefer
                      EndpointIDRef.
                    minLength: 1
                    type: string
                  endpointIdRef:
                    description: EndpointIDRef references an Endpoint in this namespace.
                    properties:
                      name:
                        description: Name of the referenced object.
                        type: string
                      policy:
                        description: Policies for referencing.
                        properties:
                          resolution:
                            default: Required
                            description: |-
                              Resolution specifies whether resolution of this reference is required.
                              The default is 'Required', which means the reconcile will fail if the
                              reference cannot be resolved. 'Optional' means this reference will be
                              a no-op if it cannot be resolved.
                            enum:
                            - Required
                            - Optional
                            type: string
                          resolve:
                            description: |-
                              Resolve specifies when this reference should be resolved. The default
                              is 'IfNotPresent', which will attempt to resolve the reference only when
                              the corresponding field is not present. Use 'Always' to resolve the
                              reference on every reconcile.
                            enum:
                            - Always
                            - IfNotPresent
                            type: string
                        type: object
                    required:
                    - name
                    type: object
                  expectedModelId:
                    description: ExpectedModelID is required to appear exactly in
                      the OpenAI models response.
                    maxLength: 512
                    minLength: 1
                    type: string
                  inferenceCredentialsSecretRef:
                    description: |-
                      InferenceCredentialsSecretRef contains an endpoint-scoped token. It must
                      never reference the management-key Secret used by ProviderConfig.
                    properties:
                      key:
                        type: string
                      name:
                        description: Name of the secret.
                        type: string
                    required:
                    - key
                    - name
                    type: object
                  maxLifetimeSeconds:
                    description: |-
                      MaxLifetimeSeconds is the hard lifetime of the admitted route. The check
                      controller self-deletes the CR at expiry, causing model-router to fail closed.
                    format: int32
                    maximum: 86400
                    minimum: 60
                    type: integer
                    x-kubernetes-validations:
                    - message: maxLifetimeSeconds is immutable
                      rule: self == oldSelf
                  timeoutSeconds:
                    default: 15
                    description: TimeoutSeconds bounds each probe request.
                    format: int32
                    maximum: 60
                    minimum: 1
                    type: integer
                required:
                - expectedModelId
                - inferenceCredentialsSecretRef
                - maxLifetimeSeconds
                type: object
                x-kubernetes-validations:
                - message: exactly one of endpointId or endpointIdRef is required
                  rule: has(self.endpointId) != has(self.endpointIdRef)
              managementPolicies:
                default:
                - '*'
                description: |-
                  THIS IS A BETA FIELD. It is on by default but can be opted out
                  through a Crossplane feature flag.
                  ManagementPolicies specify the array of actions Crossplane is allowed to
                  take on the managed and external resources.
                  See the design doc for more information: https://github.com/crossplane/crossplane/blob/499895a25d1a1a0ba1604944ef98ac7a1a71f197/design/design-doc-observe-only-resources.md?plain=1#L223
                  and this one: https://github.com/crossplane/crossplane/blob/444267e84783136daa93568b364a5f01228cacbe/design/one-pager-ignore-changes.md
                items:
                  description: |-
                    A ManagementAction represents an action that the Crossplane controllers
                    can take on an external resource.
                  enum:
                  - Observe
                  - Create
                  - Update
                  - Delete
                  - LateInitialize
                  - '*'
                  type: string
                type: array
              providerConfigRef:
                default:
                  kind: ClusterProviderConfig
                  name: default
                description: |-
                  ProviderConfigReference specifies how the provider that will be used to
                  create, observe, update, and delete this managed resource should be
                  configured.
                properties:
                  kind:
                    description: Kind of the referenced object.
                    type: string
                  name:
                    description: Name of the referenced object.
                    type: string
                required:
                - kind
                - name
                type: object
              writeConnectionSecretToRef:
                description: |-
                  WriteConnectionSecretToReference specifies the namespace and name of a
                  Secret to which any connection details for this managed resource should
                  be written. Connection details frequently include the endpoint, username,
                  and password required to connect to the managed resource.
                properties:
                  name:
                    description: Name of the secret.
                    type: string
                required:
                - name
                type: object
            required:
            - forProvider
            type: object
          status:
            properties:
              atProvider:
                properties:
                  credentialsSecretResourceVersion:
                    description: |-
                      CredentialsSecretResourceVersion binds admission to the exact Secret
                      version used by the authenticated checks. It is metadata, never secret
                      material. A credential rotation withdraws routing until it is reverified.
                    type: string
                  endpointId:
                    type: string
                  healthy:
                    type: boolean
                  inferenceUrl:
                    type: string
                  lastCheckedAt:
                    format: date-time
                    type: string
                  modelVerified:
                    type: boolean
                  toolCallVerified:
                    type: boolean
                type: object
              conditions:
                description: Conditions of the resource.
                items:
                  description: A Condition that may apply to a resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        LastTransitionTime is the last time this condition transitioned from one
                        status to another.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        A Message containing details about this condition's last transition from
                        one status to another, if any.
                      type: string
                    observedGeneration:
                      description: |-
                        ObservedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      type: integer
                    reason:
                      description: A Reason for this condition's last transition from
                        one status to another.
                      type: string
                    status:
                      description: Status of this condition; is it currently True,
                        False, or Unknown?
                      type: string
                    type:
                      description: |-
                        Type of this condition. At most one of each condition type may apply to
                        a resource at any point in time.
                      type: string
                  required:
                  - lastTransitionTime
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              lastHandledReconcileAt:
                description: |-
                  LastHandledReconcileAt holds the value of the most recent
                  reconcile-requested-at annotation token that the controller has
                  processed. Users can compare this to the annotation to determine
                  whether a reconcile request has been handled.
                type: string
              observedGeneration:
                description: |-
                  ObservedGeneration is the latest metadata.generation
                  which resulted in either a ready state, or stalled due to error
                  it can not recover from without human intervention.
                format: int64
                type: integer
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
